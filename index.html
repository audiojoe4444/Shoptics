<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="application-name" content="Shoptics">
<meta name="description" content="Shoptics — a say-it-and-it's-there shopping list for Meta Ray-Ban Display.">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Shoptics</title>
<link rel="icon" href="icon-96.png" sizes="96x96" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#000;
    --ink:#F4F6FF;
    --muted:#8D93B0;
    --lime:#C8FF3D;
    --pink:#FF4FB3;
    --cyan:#3DE8FF;
    --panel:#12141F;
    --panel2:#1B1E2E;
    --c-produce:#7CFF6B;
    --c-dairy:#FFF06A;
    --c-pantry:#FFB347;
    --c-meat:#FF6B6B;
    --c-household:#5CE1FF;
    --c-personal:#C59BFF;
    --c-treats:#FF5FC8;
    --c-other:#C9CCDA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:600px;height:600px;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus{outline:none}

  #app{position:relative;width:600px;height:600px;transition:opacity 1.2s ease, filter 1.2s ease}
  #app.dim{opacity:.38;filter:saturate(.6)}

  .view{position:absolute;inset:0;display:none;flex-direction:column}
  .view.active{display:flex}

  /* ---------- HOME ---------- */
  #home{align-items:center;padding:30px 40px 34px}
  .brand{display:flex;align-items:center;gap:16px;margin-top:14px}
  .brand .appicon{width:92px;height:92px;flex:none}
  .word{font-size:54px;font-weight:900;letter-spacing:-1.5px;line-height:1}
  .word b{color:var(--lime)}
  .tag{color:var(--muted);font-size:18px;margin-top:8px;font-weight:600;letter-spacing:.3px}
  .lens{animation:lensGlow 3.2s ease-in-out infinite}
  .lens.r{animation-delay:1.6s}
  @keyframes lensGlow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.55}}
  .spark{transform-origin:center;transform-box:fill-box;animation:spark 2.4s ease-in-out infinite}
  @keyframes spark{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(45deg);opacity:1}}

  .say-wrap{position:relative;width:100%;margin-top:42px}
  #say{
    width:100%;height:132px;border-radius:66px;
    background:linear-gradient(135deg,#1a2a05,#0b1402);
    border:3px solid rgba(200,255,61,.45);
    color:var(--lime);font:inherit;font-size:34px;font-weight:800;text-align:center;
    padding:0 40px 0 112px;caret-color:var(--lime);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  #say::placeholder{color:var(--lime);opacity:1}
  #say:focus{border-color:var(--lime);box-shadow:0 0 0 6px rgba(200,255,61,.18),0 0 38px rgba(200,255,61,.35);transform:scale(1.02)}
  .mic{position:absolute;left:22px;top:50%;width:84px;height:84px;margin-top:-42px;border-radius:50%;
       background:var(--lime);display:grid;place-items:center;pointer-events:none;z-index:1}
  .mic svg{width:40px;height:40px}
  .mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--lime);animation:ping 2.2s ease-out infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.55);opacity:0}}
  .hint{color:var(--muted);font-size:17px;margin-top:12px;text-align:center;font-weight:600}

  #openList{margin-top:22px;width:100%;height:150px;border-radius:75px;position:relative;
    background:linear-gradient(135deg,#032a33,#01141a);border:3px solid rgba(61,232,255,.45);
    color:var(--cyan);padding-left:96px;display:flex;align-items:center;justify-content:center;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
  #openList:focus{border-color:var(--cyan);box-shadow:0 0 0 6px rgba(61,232,255,.18),0 0 38px rgba(61,232,255,.35);transform:scale(1.02)}
  #openList .mic{left:26px;width:96px;height:96px;margin-top:-48px;background:var(--cyan)}
  #openList .mic::after{border-color:var(--cyan);animation:none}
  #openList .mic svg{width:46px;height:46px}
  .ltxt{display:flex;flex-direction:column;align-items:center;font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1.05}
  .lsub{font-size:18px;font-weight:700;letter-spacing:.2px;color:#8ad9e6;margin-top:6px}
  .dots{position:absolute;right:34px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;flex-wrap:wrap;max-height:110px}
  .dots i{width:11px;height:11px;border-radius:50%}

  /* home "Say it!" launcher */
  #goSay{width:100%;height:150px;margin-top:auto;border-radius:75px;position:relative;
    background:linear-gradient(135deg,#1a2a05,#0b1402);border:3px solid rgba(200,255,61,.45);
    color:var(--lime);font-size:44px;font-weight:900;letter-spacing:-1px;padding-left:96px;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
  #goSay:focus{border-color:var(--lime);box-shadow:0 0 0 6px rgba(200,255,61,.18),0 0 38px rgba(200,255,61,.35);transform:scale(1.02)}
  #goSay .mic{left:26px;width:96px;height:96px;margin-top:-48px}
  #goSay .mic svg{width:46px;height:46px}

  /* say page */
  #sayView{align-items:center;padding:22px 26px 26px}
  .stop{display:flex;align-items:center;width:100%;height:76px;flex:none}
  .stop .cnt{margin-left:auto;font-size:17px;font-weight:800;color:var(--muted)}
  .sq{font-size:36px;font-weight:900;letter-spacing:-.8px;margin-top:26px;text-align:center}
  .sq b{color:var(--lime)}
  #typeIt{margin-top:auto;height:72px;padding:0 28px;border-radius:36px;border:2px solid transparent;
    display:flex;align-items:center;gap:12px;font-size:21px;font-weight:700;color:var(--muted);letter-spacing:.3px;transition:all .2s}
  #typeIt svg{width:26px;height:26px;opacity:.8}
  #typeIt span{border-bottom:2px solid rgba(255,79,179,.45);padding-bottom:2px}
  #typeIt:focus{color:var(--pink);border-color:rgba(255,79,179,.6);background:rgba(255,79,179,.08);box-shadow:0 0 24px rgba(255,79,179,.25)}
  #typeIt:focus span{border-bottom-color:transparent}

  /* on-screen keyboard */
  .kq{font-size:30px;font-weight:900;letter-spacing:-.6px;margin-top:2px}
  .kq b{color:var(--pink)}
  #mText{margin-top:12px;height:70px;border-radius:20px;background:#1a0a14;border:3px solid rgba(255,79,179,.55);
    display:flex;align-items:center;padding:0 22px;font-size:30px;font-weight:800;white-space:nowrap;overflow:hidden}
  #mText .ph{color:#7a4a66}
  #mText .caret{display:inline-block;width:3px;height:34px;background:var(--pink);margin-left:3px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #sugg{display:flex;gap:10px;height:58px;margin-top:12px;flex:none}
  .sug{flex:1;min-width:0;border-radius:18px;background:var(--panel);border:2px solid #2b3050;font-size:20px;font-weight:800;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;transition:all .14s}
  .sug:focus{border-color:var(--cc,var(--pink));color:var(--cc,var(--pink));background:var(--panel2);transform:scale(1.05);box-shadow:0 0 20px rgba(255,79,179,.25)}
  .sug.ghost{visibility:hidden}
  #kb{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .krow{display:flex;gap:6px;justify-content:center}
  .k.go,.k.wide{height:66px}
  .k{width:49px;height:64px;border-radius:14px;background:var(--panel);border:2px solid #262a3e;font-size:24px;font-weight:800;
     text-transform:uppercase;transition:transform .1s,border-color .1s,background .1s}
  .k:focus{border-color:var(--pink);color:var(--pink);background:var(--panel2);transform:scale(1.18);box-shadow:0 0 18px rgba(255,79,179,.4);position:relative;z-index:2}
  .k.wide{width:auto;flex:1;text-transform:none;font-size:20px}
  .k.del{width:104px;text-transform:none;font-size:24px;color:var(--muted)}
  .k.go{width:auto;flex:1;background:var(--lime);border-color:var(--lime);color:#000;text-transform:none;font-size:22px;font-weight:900}
  .k.go:focus{color:#000;background:var(--lime);transform:scale(1.04);box-shadow:0 0 26px rgba(200,255,61,.5)}
  .k:active{transform:scale(.92)}

  /* ---------- MANUAL ADD ---------- */
  #manual{padding:18px 26px 18px}
  .mstep{display:none;flex-direction:column;height:100%}
  .mstep.on{display:flex}
  .mtop{display:flex;align-items:center;gap:16px;height:72px;flex:none}
  .mtop .stepn{margin-left:auto;font-size:17px;font-weight:800;color:var(--muted)}
  .mq{font-size:38px;font-weight:900;letter-spacing:-.8px;margin-top:22px}
  .mq b{color:var(--pink)}
  .back2{flex:none;white-space:nowrap;height:68px;padding:0 20px 0 14px;border-radius:22px;background:var(--panel);border:3px solid #262a3e;font-size:21px;font-weight:800;transition:all .18s}
  .back2:focus{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 5px rgba(61,232,255,.15)}
  .qwrap{display:flex;gap:22px;flex:1;margin-top:8px}
  .qleft{width:178px;display:flex;flex-direction:column}
  .qleft .mq{font-size:34px;margin-top:6px;line-height:1.05}
  .qname{margin-top:14px;font-size:21px;font-weight:800;padding:8px 14px;border-radius:16px;border:2px solid currentColor;align-self:flex-start;max-width:178px;word-break:break-word}
  #qDisp{margin-top:auto;margin-bottom:6px;font-size:96px;font-weight:900;line-height:1;color:var(--pink);font-variant-numeric:tabular-nums}
  #qDisp.ph{color:#4a2a3e}
  #qDisp small{font-size:40px;margin-left:2px}
  .pad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:12px;padding-bottom:4px}
  .key{border-radius:22px;background:var(--panel);border:3px solid #262a3e;font-size:36px;font-weight:900;transition:all .12s;font-variant-numeric:tabular-nums}
  .key:focus{border-color:var(--pink);background:var(--panel2);color:var(--pink);transform:scale(1.07);box-shadow:0 0 24px rgba(255,79,179,.35)}
  .key.del{font-size:30px;color:var(--muted)}
  .key.ok{background:var(--lime);border-color:var(--lime);color:#000;font-size:24px}
  .key.ok:focus{color:#000;background:var(--lime);box-shadow:0 0 30px rgba(200,255,61,.55)}
  .key:active{transform:scale(.94)}

  /* ---------- TOAST ---------- */
  #toast{position:absolute;left:40px;right:40px;top:212px;z-index:20;padding:20px 24px;border-radius:28px;
    background:#0d1803;border:3px solid var(--lime);box-shadow:0 0 40px rgba(200,255,61,.35);
    transform:translateY(16px) scale(.92);opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.2,1.4,.4,1)}
  #toast.show{opacity:1;transform:none}
  #toast.warn{border-color:var(--pink);background:#1d0612;box-shadow:0 0 40px rgba(255,79,179,.3)}
  #toast .hd{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:900;color:var(--lime)}
  #toast.warn .hd{color:var(--pink)}
  #toast .hd .tick{width:40px;height:40px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:#000;font-size:26px}
  #toast.warn .hd .tick{background:var(--pink)}
  #toast .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  #toast .chip{font-size:19px;font-weight:700;padding:6px 14px;border-radius:999px;background:#1f2a10;border:2px solid currentColor}
  .burst{position:absolute;width:10px;height:10px;border-radius:50%;z-index:19;pointer-events:none;animation:burst .8s ease-out forwards}
  @keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

  /* ---------- LIST ---------- */
  #list{padding:22px 16px 0}
  .lhead{display:flex;align-items:center;gap:16px;flex:none;height:88px;padding:0 10px}
  #back{height:72px;padding:0 22px 0 16px;border-radius:24px;background:var(--panel);border:3px solid #262a3e;
        font-size:22px;font-weight:800;display:flex;align-items:center;gap:6px;transition:all .18s}
  #back:focus{border-color:var(--cyan);box-shadow:0 0 0 5px rgba(61,232,255,.15);color:var(--cyan)}
  .ltitle{flex:1}
  .ltitle .t{font-size:30px;font-weight:900;letter-spacing:-.5px}
  .ltitle .s{font-size:17px;color:var(--muted);font-weight:700;margin-top:2px}
  .prog{width:72px;height:72px;position:relative;flex:none}
  .prog svg{width:72px;height:72px;transform:rotate(-90deg)}
  .prog span{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:900}

  #scroller{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:8px 14px 40px;margin-top:6px;
            -webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
  #scroller::-webkit-scrollbar{display:none}
  .cat{position:sticky;top:-8px;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;
       font-size:17px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;padding:14px 6px 8px}
  .cat .pill{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
  .cat .pill svg{width:18px;height:18px}
  .cat .n{margin-left:auto;color:var(--muted);letter-spacing:0}
  .item{display:flex;align-items:center;gap:18px;width:100%;min-height:88px;padding:10px 20px;margin:6px 0;border-radius:24px;
        background:var(--panel);border:3px solid transparent;text-align:left;scroll-margin:90px 0 70px;
        transition:transform .16s ease,border-color .16s ease,background .16s ease,opacity .3s ease}
  .item:focus{border-color:var(--cc);background:var(--panel2);transform:scale(1.025);box-shadow:0 0 26px color-mix(in srgb,var(--cc) 35%,transparent)}
  .box{width:44px;height:44px;border-radius:14px;border:3px solid var(--cc);flex:none;display:grid;place-items:center;transition:all .2s}
  .box svg{width:28px;height:28px;opacity:0;transform:scale(.3);transition:all .25s cubic-bezier(.2,1.6,.4,1)}
  .qty{font-size:24px;font-weight:900;color:var(--cc);flex:none}
  .nm{font-size:27px;font-weight:800;line-height:1.15;flex:1;word-break:break-word}
  .item.bought{opacity:.36;background:transparent}
  .item.bought:focus{opacity:.75}
  .item.bought .box{background:var(--cc)}
  .item.bought .box svg{opacity:1;transform:none}
  .item.bought .nm{text-decoration:line-through;text-decoration-thickness:3px}
  .item.pop .box{animation:pop .35s ease}
  @keyframes pop{50%{transform:scale(1.35)}}
  .empty{text-align:center;margin-top:90px;color:var(--muted);font-size:24px;font-weight:700;line-height:1.5}
  .empty b{color:var(--lime);display:block;font-size:34px;margin-bottom:8px}
  .lfoot{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:15px;color:#5d6380;font-weight:700;pointer-events:none}

  /* ---------- MODAL ---------- */
  #modal{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82)}
  #modal.show{display:flex}
  .mcard{width:520px;padding:34px 30px 30px;border-radius:36px;background:#0f1120;border:3px solid #2b3050;text-align:center;
         animation:mIn .28s cubic-bezier(.2,1.4,.4,1)}
  @keyframes mIn{from{transform:scale(.85);opacity:0}}
  .mcard .q{font-size:31px;font-weight:900;line-height:1.2}
  .mcard .sub{font-size:19px;color:var(--muted);margin-top:10px;font-weight:600}
  .mbtns{display:flex;gap:16px;margin-top:28px}
  .mbtn{flex:1;height:92px;border-radius:26px;font-size:25px;font-weight:900;background:var(--panel2);border:3px solid #2b3050;transition:all .16s}
  .mbtn:focus{transform:scale(1.04)}
  .mbtn.yes:focus{background:var(--lime);border-color:var(--lime);color:#000;box-shadow:0 0 30px rgba(200,255,61,.4)}
  .mbtn.no:focus{background:var(--pink);border-color:var(--pink);color:#000;box-shadow:0 0 30px rgba(255,79,179,.4)}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="home" class="view active" aria-label="Add items">
    <div class="brand">
<svg class="appicon" viewBox="0 0 512 512" aria-hidden="true">
  <defs>
    <linearGradient id="lgbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f36"/><stop offset="1" stop-color="#05060b"/>
    </linearGradient>
    <linearGradient id="lglime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4FF7A"/><stop offset="1" stop-color="#9BE01A"/>
    </linearGradient>
    <linearGradient id="lgcyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FF4FF"/><stop offset="1" stop-color="#1FB8E8"/>
    </linearGradient>
    <filter id="lgglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#lgbg)"/>
  <rect x="10" y="10" width="492" height="492" rx="114" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
  <g filter="url(#lgglow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M70 118 H124 L156 300 H392" stroke="url(#lglime)" stroke-width="30"/>
    <path d="M138 160 H420 L392 262 H164" stroke="url(#lglime)" stroke-width="30"/>
    <path d="M226 206 l30 30 l62 -62" stroke="#ffffff" stroke-width="24"/>
    <circle cx="190" cy="372" r="46" stroke="url(#lgcyan)" stroke-width="22"/>
    <circle cx="358" cy="372" r="46" stroke="url(#lgcyan)" stroke-width="22"/>
    <path d="M238 366 Q274 340 310 366" stroke="url(#lgcyan)" stroke-width="18"/>
  </g>
  <path d="M168 352 a28 28 0 0 1 22 -10" stroke="#fff" stroke-opacity=".85" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M336 352 a28 28 0 0 1 22 -10" stroke="#fff" stroke-opacity=".85" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M430 66 l9 25 l25 9 l-25 9 l-9 25 l-9 -25 l-25 -9 l25 -9z" fill="#FF4FB3" filter="url(#lgglow)"/>
</svg>
      <div>
        <div class="word">Shop<b>tics</b></div>
      </div>
    </div>
    <div class="tag">See it. Say it. Sorted.</div>

    <button id="goSay" class="focusable" aria-label="Say it — add items">
      <span class="mic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2.5" width="6" height="12" rx="3" fill="#000"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/>
        </svg>
      </span>Say it!
    </button>

    <button id="openList" class="focusable" aria-label="Open shopping list">
      <span class="mic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.8" stroke-linecap="round"><path d="M8.5 6h12M8.5 12h12M8.5 18h12M3.8 6h.01M3.8 12h.01M3.8 18h.01"/></svg>
      </span>
      <span class="ltxt">My List<span class="lsub" id="listSub">Nothing yet</span></span>
      <span class="dots" id="dots"></span>
    </button>
  </section>

  <!-- SAY PAGE -->
  <section id="sayView" class="view" aria-label="Say items">
    <div class="stop"><button class="back2" id="sBack">‹ Home</button><span class="cnt" id="sCnt"></span></div>
    <div class="sq">What do you <b>need?</b></div>
    <div class="say-wrap" style="margin-top:30px">
      <span class="mic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2.5" width="6" height="12" rx="3" fill="#000"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/>
        </svg>
      </span>
      <input id="say" class="focusable" type="text" inputmode="text" autocomplete="off" autocorrect="on"
             enterkeyhint="done" placeholder="Press &amp; speak" aria-label="Press, then speak your items">
    </div>
    <div class="hint" id="hint">e.g. "two pineapples, six beers and some loo roll"</div>
    <button id="typeIt" class="focusable" aria-label="Type it instead">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
      <span>Type it instead</span>
    </button>
  </section>

  <!-- LIST -->

var KEYWORDS = {

  meat: "chicken, chicken breast, chicken thigh, chicken wing, whole chicken, beef mince, minced beef, mince, steak, sirloin, ribeye, pork, pork chop, pork belly, lamb, lamb chop, bacon, sausage, chipolata, ham, turkey, duck, gammon, salami, chorizo, pepperoni, burger, meatball, prawn, king prawn, shrimp, salmon, smoked salmon, cod, haddock, tuna steak, fish, fish finger, fish fillet, fish and chip, mackerel, sardine, crab, lobster, mussel, scallop, squid, calamari, venison, veal, liver, meat, rib, brisket, joint, roast, pastrami, prosciutto, parma ham, trout, sea bass, seabass, tilapia, quorn, kebab, hot dog, frankfurter, black pudding, pate",
  household: "paper towel, kitchen roll, kitchen towel, toilet roll, toilet paper, loo roll, bog roll, tissue, detergent, washing powder, washing liquid, laundry liquid, laundry, fabric softener, softener, bleach, cleaner, surface cleaner, spray, surface spray, bin bag, bin liner, trash bag, rubbish bag, garbage bag, sponge, scourer, cloth, dish cloth, foil, tin foil, aluminium foil, cling film, baking paper, greaseproof paper, sandwich bag, freezer bag, light bulb, bulb, battery, dishwasher tablet, dishwasher salt, rinse aid, washing up liquid, dish soap, polish, furniture polish, air freshener, candle, match, lighter, disinfectant, antibacterial, cleaning wipe, wipe, dog food, cat food, cat litter, pet food, dog treat, bird seed, rubber glove, glove, paper plate, napkin, straw, peg, mop, broom, duster, limescale, descaler, drain unblocker, toilet cleaner, toilet bleach, glass cleaner, window cleaner, hoover bag, vacuum bag, fuse",
  personal: "shampoo, conditioner, soap, hand soap, hand wash, body wash, shower gel, bubble bath, toothpaste, toothbrush, mouthwash, floss, dental floss, deodorant, antiperspirant, razor, razor blade, shaving foam, shaving gel, shaving cream, moisturiser, moisturizer, lotion, body lotion, sun cream, suncream, sunscreen, after sun, lip balm, plaster, paracetamol, ibuprofen, aspirin, painkiller, medicine, cold and flu, lemsip, vitamin, tampon, sanitary towel, sanitary pad, panty liner, nappy, diaper, baby wipe, cotton bud, cotton wool, cotton pad, hair gel, hairspray, hair spray, hair dye, hair wax, makeup, make up, mascara, foundation, nail varnish, nail polish, nail polish remover, contact lens solution, hand cream, face wash, cleanser, toner, face cream, perfume, aftershave, cologne, dry shampoo, hair tie, bobby pin, earplug, eye drop, antacid, rennie, gaviscon, hay fever tablet, allergy tablet, condom",
  treats: "beer, lager, ale, stout, bitter, ipa, cider, wine, red wine, white wine, rose, prosecco, champagne, cava, fizz, gin, tonic, vodka, whisky, whiskey, bourbon, rum, tequila, brandy, port, sherry, vermouth, liqueur, baileys, pimms, alcohol, booze, can of beer, chocolate, chocolate bar, dark chocolate, milk chocolate, sweet, sweetie, candy, crisp, pringle, dorito, tortilla chip, biscuit, cookie, digestive, hobnob, jaffa cake, cake, cupcake, doughnut, donut, brownie, flapjack, ice cream, ice lolly, lolly, popcorn, haribo, jelly baby, jelly bean, wine gum, dessert, pudding, cheesecake, tiramisu, trifle, fizzy drink, cola, coke, pepsi, lemonade, pop, energy drink, red bull, snack, dip, toffee, fudge, marshmallow, chewing gum, gum, mint, imperial, treat, pastry, croissant, pain au chocolat, danish, cookie dough, nachos, salted nut, pork scratching"
};
// Comma-separated phrases. Longest match wins, then the last word (the "head noun"): "milk chocolate" → Treats, "peanut butter" → Pantry.

var IE_WORDS = {cookies:1,brownies:1,veggies:1,smoothies:1,pies:1,sweeties:1,goodies:1,rotis:1,hoagies:1,ties:1,calories:1};
function singular(w){
  if (w.length <= 3) return w;
  if (/(ss|us|is|ous)$/.test(w)) return w;
  if (IE_WORDS[w]) return w.slice(0,-1);
  if (/ies$/.test(w)) return w.slice(0,-3)+"y";
  if (/(oes)$/.test(w)) return w.slice(0,-2);
  if (/(ches|shes|xes|sses|zes)$/.test(w)) return w.slice(0,-2);
  if (/ves$/.test(w) && w !== "olives" && w !== "chives") return w.slice(0,-3)+"f"; // loaves→loaf, halves
  if (/s$/.test(w)) return w.slice(0,-1);
  return w;
}
function tokens(str){
  return str.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim().split(" ").filter(Boolean).map(singular);
}

// Build phrase index: split keyword strings into phrases. Multi-word phrases are listed
// joined by spaces, so we need an explicit phrase list: we split on double knowledge —
// every 1, 2 or 3 word window of the keyword string that is a "known phrase".
var PHRASES = []; // {t:[tokens], cat}
Object.keys(KEYWORDS).forEach(function(cat){
  KEYWORDS[cat].split(",").forEach(function(k){ var t = tokens(k); if (t.length) PHRASES.push({t:t, cat:cat}); });
});
// explicit overrides for phrases that would otherwise land in the wrong aisle
var EXTRA = {"chocolate milk":"dairy","fabric conditioner":"household","washing up":"household",
             "salt and vinegar":"treats","cheese and onion":"treats","cookies and cream":"treats"};
Object.keys(EXTRA).forEach(function(k){ PHRASES.push({t:tokens(k),cat:EXTRA[k],boost:1}); });

function categorise(name){
  var t = tokens(name);
  var best = null;
  PHRASES.forEach(function(p){
    var n = p.t.length;
    for (var i=0;i+n<=t.length;i++){
      var ok = true;
      for (var j=0;j<n;j++){ if (t[i+j]!==p.t[j]) { ok=false; break; } }
      if (ok){
        var score = n*100 + (p.boost?50:0) + (i+n); // longer wins, then later (head noun) wins
        if (!best || score > best.score) best = {score:score, cat:p.cat};
      }
    }
  });
  return best ? best.cat : "other";
}

/* =========================================================
   VOICE / TEXT PARSER
   ========================================================= */
var NUMS = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,
  fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,
  a:1,an:1,single:1,dozen:12,couple:2,pair:2,few:0,some:0,several:0,"to":2,"too":2,"for":4,"won":1};
// "to/too/for/won" are common dictation mishearings of two/four/one — only used when followed by more words

var PROTECT = ["fish and chips","mac and cheese","macaroni and cheese","salt and vinegar","cheese and onion","sweet and sour",
  "bread and butter","gin and tonic","rum and raisin","fruit and nut","ham and cheese","strawberries and cream","cookies and cream",
  "oil and vinegar","peaches and cream","pie and mash","cold and flu","black and white","head and shoulders","marks and spencer",
  "washing up and","bubble and squeak","rock and roll"];

function parseItems(raw){
  if (!raw) return [];
  var s = " " + String(raw).toLowerCase().replace(/[’]/g,"'").replace(/\s+/g," ") + " ";
  s = s.replace(/[!?]+/g, ",");
  // protect compound names
  var holds = [];
  PROTECT.forEach(function(p){
    var re = new RegExp("\\b"+p.replace(/ /g,"\\s+")+"\\b","g");
    s = s.replace(re, function(m){ holds.push(m); return " §"+(holds.length-1)+"§ "; });
  });
  // separators
  s = s.replace(/\.(\s|$)/g, ",$1")
       .replace(/\s*(,|;|\n)\s*/g, "|")
       .replace(/\s(?:and also|and then|and|also|plus|then|as well as|&|oh and)\s/g, "|");
  var parts = s.split("|");
  var out = [];
  parts.forEach(function(part){
    part = part.replace(/§(\d+)§/g, function(_,i){ return holds[+i]; }).trim();
    if (!part) return;
    var it = parseOne(part);
    if (it) out.push(it);
  });
  return out;
}

var LEADING_FILLER = /^(?:(?:oh|um+|uh+|er+|okay|ok|right|so|and|also|please|i need|we need|need|i want|we want|get|buy|grab|pick up|add|put|remember|don't forget|dont forget|some more|more|some|any|the|of|to the list|on the list)\s+)+/;
var TRAILING_FILLER = /\s+(?:please|thanks|thank you|as well|too|to the list|on the list|to my list|for me)$/;

function parseOne(text){
  var t = text.replace(/\s+/g," ").replace(LEADING_FILLER, "").replace(TRAILING_FILLER,"").replace(TRAILING_FILLER,"").trim();
  if (!t) return null;
  var qty = 0, m;

  // "x2" / "times 2" at end
  if ((m = t.match(/\s(?:x|times)\s?(\d+)$/))) { qty = +m[1]; t = t.slice(0, m.index).trim(); }

  // digit quantity at start: "2", "2x", "2 x"
  if (!qty && (m = t.match(/^(\d+)\s*(?:x\s+|x(?=[a-z])|\s)/))) { qty = +m[1]; t = t.slice(m[0].length).trim(); }
  // word quantity at start (handles "twenty four", "half a dozen", "a couple of", "a dozen")
  if (!qty) {
    if ((m = t.match(/^half (?:a )?dozen\s+(?:of\s+)?/))) { qty = 6; t = t.slice(m[0].length); }
    else if ((m = t.match(/^(?:a |one )?dozen\s+(?:of\s+)?/))) { qty = 12; t = t.slice(m[0].length); }
    else if ((m = t.match(/^(?:a )?(couple|pair|few|bunch|load|lot)s?\s+(?:of\s+)?/))) {
      qty = (m[1]==="couple"||m[1]==="pair") ? 2 : 0; t = t.slice(m[0].length);
    } else {
      var words = t.split(" ");
      var w0 = words[0], w1 = words[1];
      if (words.length > 1 && NUMS.hasOwnProperty(w0)) {
        var n = NUMS[w0], used = 1;
        if (n >= 20 && n % 10 === 0 && NUMS.hasOwnProperty(w1) && NUMS[w1] > 0 && NUMS[w1] < 10 && words.length > 2) { n += NUMS[w1]; used = 2; }
        if ((w0==="to"||w0==="too"||w0==="for"||w0==="won") && words.length < 2) { n = 0; used = 0; }
        qty = (w0==="a"||w0==="an"||w0==="single") ? 0 : n;
        t = words.slice(used).join(" ");
        // "a dozen eggs" after "a"
        if ((m = t.match(/^dozen\s+(?:of\s+)?/))) { qty = 12; t = t.slice(m[0].length); }
        if ((m = t.match(/^(?:couple|pair)\s+(?:of\s+)?/))) { qty = 2; t = t.slice(m[0].length); }
        if ((m = t.match(/^(\d+)\s+/)) && !qty) { qty = +m[1]; t = t.slice(m[0].length); }
      }
    }
  }
  t = t.replace(/^(?:of|some|more|x)\s+/,"").replace(LEADING_FILLER,"").trim();
  if (!t || /^\d+$/.test(t)) return null;
  if (qty === 1) qty = 0; // "one bread" reads better as just "Bread"
  var name = titleCase(t);
  return { name:name, qty:qty||0, key:tokens(t).join(" "), cat:categorise(t) };
}

var SMALL = {of:1,and:1,"in":1,on:1,"for":1,the:1,a:1,with:1,au:1};
function titleCase(s){
  return s.split(" ").map(function(w,i){
    if (i>0 && SMALL[w]) return w;
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join(" ");
}

/* =========================================================
   STATE (localStorage)
   ========================================================= */
var STORE_KEY = "shoptics.v1";
var items = [];
function load(){ try { items = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch(e){ items = []; } }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(items)); } catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function addParsed(list){
  var added = [];
  list.forEach(function(p){
    var ex = null;
    for (var i=0;i<items.length;i++){ if (items[i].key === p.key){ ex = items[i]; break; } }
    if (ex){
      if (ex.bought){ ex.bought = false; ex.qty = p.qty; }
      else if (p.qty || ex.qty){ ex.qty = (ex.qty||1) + (p.qty||1); }
      ex.name = p.name;
      added.push(ex);
    } else {
      var it = {id:uid(), name:p.name, key:p.key, qty:p.qty, cat:p.cat, bought:false, t:Date.now()};
      items.push(it); added.push(it);
    }
  });
  save();
  return added;
}
function label(it){ return (it.qty ? it.qty+" × " : "") + it.name; }

/* =========================================================

   ========================================================= */
var $ = function(id){ return document.getElementById(id); };
var app = $("app"), say = $("say"), toast = $("toast");
var view = "home";
var modalState = null; // {q, sub, yes, no, onYes, returnFocus}
var lastFocusInList = null;
var homeFocus = null;

// Browsers (including the glasses) can restore an old focus after a Back/history step.
// settle() puts focus where we want it and re-asserts it briefly unless the wearer has moved on.
var lastKeyAt = 0;
function settle(el, long){
  if (!el) return;
  var t0 = Date.now();
  el.focus();
  // "long" also covers the glasses' text box closing after dictation, which can move focus
  (long ? [40, 150, 350, 700, 1100, 1600, 2400] : [40, 150, 350, 700]).forEach(function(ms){
    setTimeout(function(){
      if (lastKeyAt > t0 || !document.body.contains(el) || el.offsetParent === null) return;
      if (document.activeElement !== el) el.focus();
    }, ms);
  });
}
function show(v){
  view = v;
  $("home").classList.toggle("active", v==="home");
  $("list").classList.toggle("active", v==="list");
  $("manual").classList.toggle("active", v==="manual");
  $("sayView").classList.toggle("active", v==="say");
  if (v==="home"){ renderHome(); settle(homeFocus || $("goSay")); homeFocus = null; }
  else if (v==="say"){ renderHome(); settle(homeFocus || say); homeFocus = null; }
  else if (v==="manual"){ /* handled by manualStep() */ }
  else { renderList(); var f = lastFocusInList && document.querySelector('.item[data-id="'+lastFocusInList+'"]');
         settle(f || document.querySelector(".item") || $("back")); }
}

function renderHome(){
  var left = items.filter(function(i){return !i.bought;}).length;
  var got = items.length - left;
  var lc = items.filter(function(i){return !i.bought;}).length;
  $("sCnt").textContent = lc ? lc+" on your list" : "";
  $("listSub").textContent = items.length ? (left+" to get" + (got ? " · "+got+" in basket" : "")) : "Nothing yet";
  var dots = $("dots"); dots.innerHTML = "";
  CATS.forEach(function(c){
    if (items.some(function(i){return i.cat===c.id && !i.bought;})){
      var d = document.createElement("i"); d.style.background = c.hex; dots.appendChild(d);
    }
  });
}

function renderList(){
  var sc = $("scroller"); sc.innerHTML = "";
  var left = items.filter(function(i){return !i.bought;}).length;
  var pct = items.length ? Math.round((items.length-left)/items.length*100) : 0;
  $("lsub").textContent = items.length ? (left ? left+" left to grab" : "All done — nice!") : "Empty";
  $("progArc").style.strokeDashoffset = 188.5*(1-pct/100);
  $("progTxt").textContent = pct+"%";
  if (!items.length){
    sc.innerHTML = '<div class="empty"><b>All clear!</b>Go back and say what you need.</div>';
    return;
  }
  CATS.forEach(function(c){
    var list = items.filter(function(i){return i.cat===c.id;});
    if (!list.length) return;
    var h = document.createElement("div");
    h.className = "cat"; h.style.color = c.hex; h.dataset.cat = c.id;
    var remaining = list.filter(function(i){return !i.bought;}).length;
    h.innerHTML = '<span class="pill" style="background:'+c.hex+'"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+c.icon+'</svg></span>'+
                  esc(c.name)+'<span class="n">'+remaining+'/'+list.length+'</span>';
    sc.appendChild(h);
    list.forEach(function(it){
      var b = document.createElement("button");
      b.className = "item focusable"+(it.bought?" bought":"");
      b.dataset.id = it.id;
      b.style.setProperty("--cc", c.hex);
      b.setAttribute("aria-label", label(it)+(it.bought?", in basket":""));
      b.innerHTML = '<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>'+
                    (it.qty ? '<span class="qty">'+it.qty+'×</span>' : '')+
                    '<span class="nm">'+esc(it.name)+'</span>';
      sc.appendChild(b);
    });
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function findItem(id){ for (var i=0;i<items.length;i++) if (items[i].id===id) return items[i]; return null; }

function refreshItem(id){
  var it = findItem(id); var el = document.querySelector('.item[data-id="'+id+'"]');
  if (!el || !it) return;
  el.classList.toggle("bought", it.bought);
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  el.setAttribute("aria-label", label(it)+(it.bought?", in basket":""));
  // update counters without rebuilding (keeps focus & scroll)
  var left = items.filter(function(i){return !i.bought;}).length;
  var pct = Math.round((items.length-left)/items.length*100);
  $("lsub").textContent = left ? left+" left to grab" : "All done — nice!";
  $("progArc").style.strokeDashoffset = 188.5*(1-pct/100);
  $("progTxt").textContent = pct+"%";
  var heads = document.querySelectorAll(".cat");
  heads.forEach(function(h){
    var c = CAT_BY_ID[h.dataset.cat]; if (!c) return;
    var list = items.filter(function(i){return i.cat===c.id;});
    h.querySelector(".n").textContent = list.filter(function(i){return !i.bought;}).length+"/"+list.length;
  });
}

function onItemActivate(el){
  var it = findItem(el.dataset.id); if (!it) return;
  lastFocusInList = it.id;
  if (!it.bought){
    it.bought = true; save(); refreshItem(it.id);
  } else {
    openModal({
      q: "Put “"+label(it)+"” back on the list?",
      sub: "Handy if it was leaking, damaged or out of date.",
      yes: "Yes, re-add", no: "No",
      defaultYes: true,
      onYes: function(){ it.bought = false; save(); refreshItem(it.id); },
      returnFocus: el
    });
  }
}

function onItemRemove(el){
  var it = findItem(el.dataset.id); if (!it) return;
  openModal({
    q: "Remove “"+label(it)+"”?",
    sub: "It'll be deleted from the list.",
    yes: "Remove", no: "Keep it",
    defaultYes: true,
    onYes: function(){
      var idx = items.indexOf(it);
      var nextId = null, els = Array.prototype.slice.call(document.querySelectorAll(".item"));
      var pos = els.indexOf(el); var n = els[pos+1] || els[pos-1]; if (n) nextId = n.dataset.id;
      items.splice(idx,1); save(); lastFocusInList = nextId; renderList();
      var f = nextId && document.querySelector('.item[data-id="'+nextId+'"]'); (f || $("back")).focus();
      return true; // focus handled
    },
    returnFocus: el
  });
}

/* ---------- leaving the list ---------- */
function exitList(){
  var bought = items.filter(function(i){return i.bought;});
  show("home");
  if (!bought.length) return;
  openModal({
    q: "Clear the "+bought.length+" ticked item"+(bought.length>1?"s":"")+"?",
    sub: "Unticked items stay on your list.",
    yes: "Yes, clear", no: "Keep them",
    defaultYes: true,
    onYes: function(){ items = items.filter(function(i){return !i.bought;}); save(); renderHome(); flash("Cleared!", [], false); },
    returnFocus: $("goSay")
  });
}

/* ---------- modal ---------- */
function openModal(o){
  modalState = o;
  $("mQ").textContent = o.q; $("mSub").textContent = o.sub || "";
  $("mYes").textContent = o.yes; $("mNo").textContent = o.no;
  $("modal").classList.add("show");
  var target = o.defaultYes ? $("mYes") : $("mNo");
  modalMoved = false;
  settle(target);
}
var modalMoved = false;
var modalClosedAt = 0;
function closeModal(choice){
  var o = modalState; if (!o) return;
  modalState = null; modalClosedAt = Date.now();
  $("modal").classList.remove("show");
  var handled = false;
  if (choice && o.onYes) handled = o.onYes();
  if (!handled && o.returnFocus && document.body.contains(o.returnFocus)) o.returnFocus.focus();
  else if (!handled) ({home:$("goSay"), say:say, list:$("back")}[view] || $("goSay")).focus();
}
$("mYes").addEventListener("click", function(){ closeModal(true); });
$("mNo").addEventListener("click", function(){ closeModal(false); });

/* ---------- toast ---------- */
var toastT;
function flash(head, its, warn){
  $("toastHd").textContent = head;
  toast.classList.toggle("warn", !!warn);
  toast.querySelector(".tick").textContent = warn ? "?" : "✓";
  var ch = $("toastChips"); ch.innerHTML = "";
  (its||[]).slice(0,6).forEach(function(it){
    var s = document.createElement("span"); s.className = "chip";
    s.style.color = CAT_BY_ID[it.cat].hex; s.textContent = label(it); ch.appendChild(s);
  });
  if (its && its.length > 6){ var m = document.createElement("span"); m.className="chip"; m.style.color="#fff"; m.textContent="+"+(its.length-6)+" more"; ch.appendChild(m); }
  toast.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(function(){ toast.classList.remove("show"); }, warn ? 2200 : 2800);
  if (!warn && its && its.length) burst();
}
function burst(){
  var cols = ["#C8FF3D","#3DE8FF","#FF4FB3","#FFF06A","#C59BFF"];
  for (var i=0;i<18;i++){
    var d = document.createElement("span"); d.className = "burst";
    var a = Math.random()*Math.PI*2, r = 90+Math.random()*120;
    d.style.left = "300px"; d.style.top = "250px"; d.style.background = cols[i%cols.length];
    d.style.setProperty("--dx", Math.cos(a)*r+"px"); d.style.setProperty("--dy", Math.sin(a)*r+"px");
    app.appendChild(d); setTimeout(d.remove.bind(d), 850);
  }
}

/* ---------- adding (dictation/composer or keyboard) ---------- */
var lastTyped = 0, inputT;
function commit(){
  clearTimeout(inputT);
  var v = say.value.trim(); if (!v) return;
  say.value = "";
  var parsed = parseItems(v);
  if (!parsed.length){ flash("Didn't catch that", [], true); settle(say, true); return; }
  var added = addParsed(parsed);
  renderHome();
  flash(added.length > 1 ? added.length+" items added!" : "Added!", added, false);
  wake();
  settle(say, true);   // ready for the next item: one press opens dictation again
}
say.addEventListener("change", commit);
say.addEventListener("input", function(){
  wake();
  // glasses composer sends text without per-key keydowns; commit after a short pause in that case
  clearTimeout(inputT);
  if (Date.now() - lastTyped > 1500) inputT = setTimeout(commit, 1200);
});

/* =========================================================
   TYPE IT INSTEAD: Shoptics' own keyboard (no voice) → how many?
   The glasses' system text box can't be forced into keyboard mode,
   so this screen never uses a text field at all.
   ========================================================= */
var mStep = 1, mQty = "", mParsed = null, mTxt = "", unwinding = false;
var KB_ROWS = ["qwertyuiop","asdfghjkl","zxcvbnm"];
(function buildKb(){
  var kb = $("kb"), h = "";
  KB_ROWS.forEach(function(r, i){
    h += '<div class="krow">';
    r.split("").forEach(function(c){ h += '<button class="k" data-c="'+c+'">'+c+'</button>'; });
    if (i === 2) h += '<button class="k del" data-c="del" aria-label="Delete">⌫</button>';
    h += '</div>';
  });
  h += '<div class="krow"><button class="k wide" data-c=" ">space</button><button class="k go" data-c="next">Next ›</button></div>';
  kb.innerHTML = h;
})();

// Suggestion vocabulary: things you've added before (first), then every known grocery word
var VOCAB = (function(){
  var seen = {}, out = [];
  Object.keys(KEYWORDS).forEach(function(cat){
    KEYWORDS[cat].split(",").forEach(function(k){
      k = k.trim(); if (k.length < 3 || seen[k]) return; seen[k] = 1; out.push(k);
    });
  });
  return out;
})();
var HIST_KEY = "shoptics.history", hist = [];
try { hist = JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch(e){ hist = []; }
function remember(name){
  hist = [name].concat(hist.filter(function(h){ return h.toLowerCase() !== name.toLowerCase(); })).slice(0, 80);
  try { localStorage.setItem(HIST_KEY, JSON.stringify(hist)); } catch(e){}
}
function suggestions(q){
  q = q.trim().toLowerCase(); if (!q) return hist.slice(0,3);
  var res = [], seen = {};
  function push(n){ var k = n.toLowerCase(); if (!seen[k] && res.length < 3){ seen[k] = 1; res.push(n); } }
  function score(w){ var t = w.toLowerCase(); return t.indexOf(q) === 0 ? 0 : (t.indexOf(" "+q) >= 0 ? 1 : 9); }
  hist.filter(function(h){ return score(h) < 9; }).forEach(push);
  VOCAB.filter(function(v){ return score(v) < 9; })
       .sort(function(a,b){ return score(a)-score(b) || a.length-b.length; })
       .forEach(function(v){ push(titleCase(v)); });
  return res;
}
function renderText(){
  var t = $("mText");
  t.innerHTML = mTxt ? esc(titleCase(mTxt))+'<span class="caret"></span>' : '<span class="caret"></span><span class="ph">&nbsp;e.g. Lemons</span>';
  var sg = $("sugg"), list = suggestions(mTxt), had = sg.contains(document.activeElement);
  var h = "";
  for (var i=0;i<3;i++){
    var n = list[i];
    if (n){ var c = CAT_BY_ID[categorise(n)]; h += '<button class="sug" data-s="'+esc(n)+'" style="--cc:'+c.hex+'">'+esc(n)+'</button>'; }
    else h += '<span class="sug ghost"></span>';
  }
  sg.innerHTML = h;
  if (had){ var f = sg.querySelector(".sug"); (f || $("kb").querySelector('[data-c="g"]')).focus(); }
}
function kbPress(c){
  if (c === "next"){ toQty(); return; }
  if (c === "del"){ mTxt = mTxt.slice(0,-1); }
  else if (c === " "){ if (mTxt && !/ $/.test(mTxt) && mTxt.length < 40) mTxt += " "; }
  else if (mTxt.length < 40){ mTxt += c; }
  renderText();
}

function openManual(){
  mTxt = ""; mQty = ""; mParsed = null;
  try { history.pushState({v:"manual", step:1}, "", "#add"); } catch(e){}
  show("manual"); manualStep(1);
}
function manualStep(n){
  mStep = n;
  $("mStep1").classList.toggle("on", n===1);
  $("mStep2").classList.toggle("on", n===2);
  if (n===1){ renderText(); settle($("kb").querySelector('[data-c="g"]')); }
  else { renderQty(); settle($("pad").querySelector('[data-k="1"]')); }
}
function toQty(name){
  var v = (name || mTxt).trim();
  if (!v){ flash("Type an item first", [], true); return; }
  mTxt = v;
  mParsed = parseOne(v.toLowerCase().replace(/[,.;]+/g," "));
  if (!mParsed){ flash("Type an item first", [], true); return; }
  mQty = mParsed.qty ? String(mParsed.qty) : "";
  var c = CAT_BY_ID[mParsed.cat];
  $("qName").textContent = mParsed.name; $("qName").style.color = c.hex;
  try { history.pushState({v:"manual", step:2}, "", "#add"); } catch(e){}
  manualStep(2);
}
function renderQty(){
  var d = $("qDisp");
  d.classList.toggle("ph", !mQty);
  d.innerHTML = (mQty || "1") + "<small>×</small>";
}
function padPress(k){
  if (k === "ok"){ finishManual(); return; }
  if (k === "del"){ mQty = mQty.slice(0,-1); }
  else if (mQty.length < 3){ mQty = (mQty === "0" ? "" : mQty) + k; }
  renderQty();
}
function finishManual(){
  if (!mParsed) return;
  var q = parseInt(mQty || "1", 10) || 1;
  var p = {name:mParsed.name, key:mParsed.key, cat:mParsed.cat, qty: q > 1 ? q : 0};
  var ex = items.filter(function(i){ return i.key === p.key; })[0];
  var added;
  if (ex){ ex.bought = false; ex.qty = p.qty; ex.name = p.name; save(); added = [ex]; }
  else added = addParsed([p]);
  remember(p.name);
  leaveManual();
  flash("Added!", added, false);
}
function leaveManual(){
  // unwind the #add history entries so Back behaves normally afterwards
  var depth = mStep === 2 ? 2 : 1;
  homeFocus = $("typeIt");
  if (history.state && history.state.v === "manual"){ unwinding = true; history.go(-depth); }
  show("say");
}
$("goSay").addEventListener("click", function(){
  try { history.pushState({v:"say"}, "", "#say"); } catch(e){}
  show("say");
});
$("sBack").addEventListener("click", function(){ history.back(); });
$("typeIt").addEventListener("click", openManual);
$("mCancel").addEventListener("click", function(){ leaveManual(); });
$("mBack2").addEventListener("click", function(){ history.back(); });
$("kb").addEventListener("click", function(e){ var b = e.target.closest(".k"); if (b) kbPress(b.dataset.c); });
$("sugg").addEventListener("click", function(e){ var b = e.target.closest(".sug"); if (b && b.dataset.s) toQty(b.dataset.s); });
$("pad").addEventListener("click", function(e){ var b = e.target.closest(".key"); if (b) padPress(b.dataset.k); });

/* =========================================================
   NAVIGATION (Neural Band → arrow keys / Enter / Escape)
   ========================================================= */
function arr(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function focusables(){
  if (modalState) return [$("mYes"), $("mNo")];
  if (view==="home") return [$("goSay"), $("openList")];
  if (view==="say") return [$("sBack"), say, $("typeIt")];
  if (view==="manual") return mStep===1 ? [$("mCancel")].concat(arr("#sugg .sug:not(.ghost)"), arr("#kb .k"))
                                        : [$("mBack2")].concat(arr("#pad .key"));
  return [$("back")].concat(arr(".item"));
}
// Spatial navigation: pick the nearest element in the swipe direction (used for keyboards)
function spatial(dir){
  var list = focusables(), cur = document.activeElement;
  if (list.indexOf(cur) < 0){ list[0].focus(); return; }
  var r = cur.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2, best = null, bs = 1e9;
  list.forEach(function(el){
    if (el === cur) return;
    var q = el.getBoundingClientRect(), x = q.left + q.width/2, y = q.top + q.height/2, dx = x - cx, dy = y - cy, main, side;
    var gapX = Math.max(0, q.left - r.right, r.left - q.right);   // 0 when columns overlap
    if (dir === "ArrowUp"){ if (dy > -8) return; main = -dy; side = gapX*2 + Math.abs(dx)*0.3; }
    else if (dir === "ArrowDown"){ if (dy < 8) return; main = dy; side = gapX*2 + Math.abs(dx)*0.3; }
    else if (dir === "ArrowLeft"){ if (dx > -8 || Math.abs(dy) > r.height*0.6) return; main = -dx; side = Math.abs(dy); }
    else { if (dx < 8 || Math.abs(dy) > r.height*0.6) return; main = dx; side = Math.abs(dy); }
    var sc = main + (dir === "ArrowUp" || dir === "ArrowDown" ? side : side * 2.2);
    if (sc < bs){ bs = sc; best = el; }
  });
  if (best) best.focus();
}
function move(dir){
  var list = focusables(); var i = list.indexOf(document.activeElement);
  if (i < 0){ list[0].focus(); return; }
  var n = Math.max(0, Math.min(list.length-1, i+dir));
  list[n].focus();
  if (view==="list" && list[n].classList.contains("item")){
    lastFocusInList = list[n].dataset.id;
    list[n].scrollIntoView({block:"nearest", behavior:"smooth"});
  }
  if (view==="list" && list[n].id==="back") $("scroller").scrollTo({top:0, behavior:"smooth"});
}

var escTimer = null, popCount = 0;
document.addEventListener("keydown", function(e){
  var k = e.key;
  lastKeyAt = Date.now();
  if (k.length === 1) lastTyped = Date.now();
  if (dimmed){ wake(); if (k !== "Shift") { e.preventDefault(); e.stopPropagation(); } return; } // first press just wakes the screen
  wake();

  var inSay = document.activeElement === say;
  if (modalState && k.indexOf("Arrow") === 0) modalMoved = true;

  if (k === "Escape" || (k === "Backspace" && !inSay)){
    e.preventDefault();
    if (modalState){ closeModal(false); return; }
    if (view !== "home"){
      // The glasses shell may also call history.back() for the same Back gesture;
      // only act ourselves if no popstate arrives first, so we never go back twice.
      var seen = popCount;
      clearTimeout(escTimer);
      escTimer = setTimeout(function(){ if (popCount === seen) history.back(); }, 250);
    }
    return;
  }
  if (k === "Enter" && inSay){
    if (say.value.trim()){ e.preventDefault(); commit(); }
    return; // empty: let the glasses open the text composer
  }
  if (inSay && say.value && (k === "ArrowLeft" || k === "ArrowRight")) return; // caret moves on desktop

  if (view === "manual" && !modalState){
    // physical keyboard (desktop testing)
    if (mStep === 1 && /^[a-zA-Z ]$/.test(k)){ e.preventDefault(); kbPress(k === " " ? " " : k.toLowerCase()); return; }
    if (mStep === 2 && /^[0-9]$/.test(k)){ e.preventDefault(); padPress(k); return; }
    if (k.indexOf("Arrow") === 0){ e.preventDefault(); spatial(k); return; }
  }
  if (k === "ArrowDown"){ e.preventDefault(); move(1); return; }
  if (k === "ArrowUp"){ e.preventDefault(); move(-1); return; }
  if (k === "ArrowLeft" || k === "ArrowRight"){
    e.preventDefault();
    if (modalState){ move(k==="ArrowRight" ? 1 : -1); return; }
    if (view==="list"){
      var a = document.activeElement;
      if (k==="ArrowRight" && a && a.classList.contains("item")) onItemRemove(a);
      if (k==="ArrowLeft") $("back").focus(), $("scroller").scrollTo({top:0, behavior:"smooth"});
    } else {
      move(k==="ArrowRight" ? 1 : -1);
    }
    return;
  }
}, true);

$("openList").addEventListener("click", function(){
  try { history.pushState({v:"list"}, "", "#list"); } catch(e){}
  show("list");
});
$("back").addEventListener("click", function(){
  if (history.state && history.state.v === "list") history.back(); else exitList();
});
$("scroller").addEventListener("click", function(e){
  var el = e.target.closest(".item"); if (el) onItemActivate(el);
});

window.addEventListener("popstate", function(e){
  clearTimeout(escTimer); popCount++;
  var st = e.state || {};
  if (unwinding){ unwinding = false; return; }
  if (view === "manual"){
    if (st.v === "manual" && st.step === 1){ manualStep(1); return; }   // Back on "How many?" → item name
    if (st.v !== "manual"){ homeFocus = $("typeIt"); show(st.v === "say" ? "say" : "home"); }
    return;
  }
  if (view === "say"){ if (st.v !== "say") show("home"); return; }
  if (view !== "list" || st.v === "list") return;
  // Back while a pop-up is open on the list (or just closed by the same gesture): close it, stay on the list
  if (modalState || Date.now() - modalClosedAt < 500){
    if (modalState) closeModal(false);
    try { history.pushState({v:"list"}, "", "#list"); } catch(err){}
    return;
  }
  exitList();
});

/* =========================================================
   DIM AFTER 15s IDLE
   ========================================================= */
var DIM_AFTER = 15000, dimT, dimmed = false;
function wake(){
  if (dimmed){ dimmed = false; app.classList.remove("dim"); }
  clearTimeout(dimT); dimT = setTimeout(function(){ dimmed = true; app.classList.add("dim"); }, DIM_AFTER);
}
["pointerdown","touchstart","wheel"].forEach(function(ev){
  document.addEventListener(ev, function(e){
    if (dimmed && ev==="pointerdown"){ wake(); e.preventDefault(); e.stopPropagation(); return; }
    wake();
  }, {capture:true, passive: ev!=="pointerdown"});
});

/* =========================================================
   BOOT
   ========================================================= */
load();
if (/^#(list|add|say)$/.test(location.hash)){ try { history.replaceState(null, "", location.pathname + location.search); } catch(e){} }
show("home");
wake();

// Offline support so the list still opens with poor signal in-store. No audio is ever used,
// so whatever music you're playing keeps playing.
if ("serviceWorker" in navigator && location.protocol === "https:"){
  try { navigator.serviceWorker.register("sw.js").catch(function(){}); } catch(e){}
}

// exposed for testing
window.Shoptics = { parseItems: parseItems, categorise: categorise };
})();
</script>
